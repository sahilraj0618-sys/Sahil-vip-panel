<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10162d">
<title>Sahil VIP | Demo Dashboard</title>
<style>
:root{
  --bg:#090f20;--panel:#121d36;--panel2:#172544;--line:#2b3c63;
  --cyan:#42e8d5;--violet:#9b8cff;--text:#edf4ff;--muted:#91a2c4;
  --gold:#ffd477;--green:#5de0a1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Arial,sans-serif;color:var(--text)}
body{
 background:radial-gradient(circle at 15% 0%,#253b69 0,transparent 34%),
 radial-gradient(circle at 95% 35%,#25205a 0,transparent 30%),var(--bg);
}
.app{max-width:480px;min-height:100vh;margin:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
header{
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:17px 16px;border:1px solid #31466e;border-radius:17px;
 background:linear-gradient(120deg,rgba(24,43,76,.96),rgba(24,26,66,.96));
 box-shadow:0 12px 32px #02061180;
}
.brand{font-size:17px;font-weight:900;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}
.subbrand{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:4px}
.pill{font-size:10px;font-weight:800;letter-spacing:1px;padding:7px 10px;border-radius:30px;
 color:#12203b;background:var(--gold)}
.tabs{display:flex;gap:10px}
.tab{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 8px;
 background:#111c34;color:#b9c9e9;font-weight:800;cursor:pointer}
.tab.active{background:linear-gradient(120deg,var(--cyan),#8a9cff);color:#071629;border:0;
 box-shadow:0 7px 22px #42e8d544}
.card{border:1px solid #34486e;border-radius:22px;padding:22px 18px;text-align:center;
 background:linear-gradient(155deg,rgba(24,39,70,.98),rgba(15,23,46,.98));
 box-shadow:0 15px 35px #02061180}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:800}
.period{font-size:20px;font-weight:900;letter-spacing:2px;margin:8px 0 18px}
.timer{font-size:58px;line-height:1.1;font-weight:900;letter-spacing:3px;
 background:linear-gradient(90deg,var(--cyan),#c1c9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.demo-label{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:20px;
 color:#ffe1a0;background:#58451c55;border:1px solid #a27d35;font-size:10px;font-weight:800;letter-spacing:1px}
.display-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.display-box{padding:15px 8px;border:1px solid var(--line);border-radius:15px;background:#0b1429}
.display-box .name{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:800}
.display-box .value{font-size:25px;font-weight:900;margin-top:7px;color:var(--violet)}
.display-box:last-child .value{color:var(--cyan)}
.history{border:1px solid #304366;border-radius:18px;overflow:hidden;background:#101a31;flex:1;min-height:220px}
.history-head{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.2fr;gap:4px;
 padding:14px 10px;background:#1b2a49;color:#b9c9e9;font-size:9px;font-weight:900;letter-spacing:1px;text-align:center}
.history-row{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.2fr;gap:4px;
 padding:13px 10px;border-top:1px solid #253655;text-align:center;font-size:11px;color:#dce7fb}
.history-row span{align-self:center}
.status{font-size:9px;font-weight:900;color:var(--gold);background:#51421e66;padding:5px 4px;border-radius:8px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:12px}
.actions{display:flex;gap:10px}
.action{flex:1;border:1px solid var(--line);background:#172544;color:var(--text);
 padding:12px;border-radius:12px;font-weight:800;cursor:pointer}
.action.primary{background:linear-gradient(110deg,#42e8d5,#9b8cff);color:#08152a;border:0}
footer{text-align:center;color:#8293b5;font-size:10px;letter-spacing:1px;padding:5px}
@media(max-width:360px){.app{padding:11px}.timer{font-size:48px}.brand{font-size:14px}}
</style>
</head>
<body>
<main class="app">
 <header>
  <div>
   <div class="brand">Powered by Sahil VIP</div>
   <div class="subbrand">DEMO DASHBOARD</div>
  </div>
  <span class="pill">PREVIEW</span>
 </header>

 <nav class="tabs" aria-label="Demo modes">
  <button class="tab active" id="tab30" onclick="setMode(30)">WinGo 30S</button>
  <button class="tab" id="tab60" onclick="setMode(60)">WinGo 1M</button>
 </nav>

 <section class="card">
  <div class="eyebrow">DEMO PERIOD</div>
  <div class="period" id="period">PERIOD: 0001</div>
  <div class="timer" id="timer">00:30</div>
  <div class="demo-label">SAMPLE DATA · NOT A REAL RESULT</div>
  <div class="display-grid">
   <div class="display-box"><div class="name">SAMPLE FIELD A</div><div class="value">—</div></div>
   <div class="display-box"><div class="name">SAMPLE FIELD B</div><div class="value">—</div></div>
  </div>
 </section>

 <section class="history">
  <div class="history-head"><span>PERIOD</span><span>MODE</span><span>VALUE</span><span>STATUS</span></div>
  <div id="historyRows">
   <div class="history-row"><span>0001</span><span>30 SEC</span><span>—</span><span class="status">DEMO</span></div>
   <div class="history-row"><span>0002</span><span>30 SEC</span><span>—</span><span class="status">DEMO</span></div>
   <div class="history-row"><span>0003</span><span>30 SEC</span><span>—</span><span class="status">DEMO</span></div>
  </div>
 </section>

 <div class="actions">
  <button class="action" onclick="resetDemo()">RESET DEMO</button>
  <button class="action primary" onclick="addDemoRow()">ADD SAMPLE ROW</button>
 </div>
 <footer>POWERED BY SAHIL VIP · UI DEMO ONLY</footer>
</main>
<script>
let mode=30,remaining=30,period=1;
const timer=document.getElementById('timer');
const periodEl=document.getElementById('period');
const rows=document.getElementById('historyRows');
function setMode(seconds){
 mode=seconds; remaining=seconds;
 document.getElementById('tab30').classList.toggle('active',seconds===30);
 document.getElementById('tab60').classList.toggle('active',seconds===60);
 updateTimer();
}
function updateTimer(){
 timer.textContent='00:'+String(remaining).padStart(2,'0');
 periodEl.textContent='PERIOD: '+String(period).padStart(4,'0');
}
setInterval(()=>{
 remaining--;
 if(remaining<=0){remaining=mode;period++;}
 updateTimer();
},1000);
function addDemoRow(){
 const row=document.createElement('div');
 row.className='history-row';
 row.innerHTML='<span>'+String(period).padStart(4,'0')+'</span><span>'+mode+' SEC</span><span>—</span><span class="status">DEMO</span>';
 rows.prepend(row);
 while(rows.children.length>10) rows.removeChild(rows.lastElementChild);
}
function resetDemo(){
 period=1;remaining=mode;rows.innerHTML='';
 updateTimer();
}
updateTimer();
</script>
</body>
</html>
